name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python }} / Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["4.2", "5.0", "5.1", "5.2", "6.0"]
        exclude:
          # Django 6.0 dropped Python 3.10 and 3.11 support.
          - python: "3.10"
            django: "6.0"
          - python: "3.11"
            django: "6.0"
          # Django 4.2 added Python 3.13 in 4.2.16; pytest CI installs
          # the latest 4.2.* so this combo passes — but the pip
          # resolver can lag behind, so we skip pre-emptively.
          - python: "3.13"
            django: "4.2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction
          poetry run pip install "django~=${{ matrix.django }}.0"

      - name: Run pytest
        run: poetry run pytest --no-cov

  lint:
    name: lint + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: ruff (lint)
        run: poetry run ruff check .

      - name: ruff (format)
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy django_admin_rest_api

      - name: bandit
        run: poetry run bandit -c pyproject.toml -q -r django_admin_rest_api

      - name: pip-audit
        run: |
          # Upgrade pip first so its own advisory (PYSEC-2026-196, fixed in
          # 26.1.2) doesn't fail the audit — pip is tooling, not a shipped dep.
          poetry run python -m pip install --upgrade -q pip
          poetry run pip-audit

  complyedge-trustlint:
    name: ComplyEdge TrustLint (EU AI Act)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TrustLint (offline compliance linter)
        run: pip install trustlint

      - name: Fetch ComplyEdge rule corpus
        # The published `trustlint` PyPI package does not bundle the rule
        # corpus, so pull it from the public OSS repo and pass it via
        # --rules-dir. (Once trustlint ships the corpus as package data this
        # step can be dropped.)
        run: git clone --depth 1 https://github.com/ComplyEdge/ComplyEdge.git /tmp/complyedge

      - name: Scan AI-facing text for EU AI Act violations
        run: |
          set -uo pipefail
          RULES=/tmp/complyedge/rules/regulations
          # Docs / prompt / system-message files describe behaviour to humans
          # and LLMs — that's the surface an AI-Act linter cares about. Widen
          # these globs if you add dedicated prompt or system-message files.
          rc=0; count=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            count=$((count + 1))
            echo "::group::trustlint check $f"
            trustlint --rules-dir "$RULES" check --jurisdiction EU "$f" || rc=1
            echo "::endgroup::"
          done < <(git ls-files '*.md' '*.prompt' '*.system.md')
          if [ "$count" -eq 0 ]; then
            echo "::notice::TrustLint: no AI-facing files matched — nothing to scan."
          fi
          [ "$rc" -eq 0 ] || echo "::error::TrustLint found EU AI Act / compliance violations (see grouped logs above)."
          exit $rc
